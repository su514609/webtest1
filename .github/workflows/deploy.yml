name: Deploy TaskHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# GITHUB_TOKEN 默认只读，推送 gh-pages 需要 contents: write
permissions:
  contents: write

# 同分支并发时取消旧任务，避免两个部署互相覆盖
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and Build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true
